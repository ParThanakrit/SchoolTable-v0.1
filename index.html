<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolTable — ระบบจัดตารางสอนอัตโนมัติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=0.5.7">
<link rel="stylesheet" href="css/print.css?v=0.4.4">
<link rel="stylesheet" href="css/ux.css?v=0.5.7">
<link rel="stylesheet" href="css/theme.css?v=0.5.20">
<script>
/* กำหนดธีมและขนาดหน้าจอก่อนวาดหน้า เพื่อไม่ให้หน้าจอกะพริบตอนเปิด */
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('schooltable.theme') || 'system'; } catch (e) { }
  var dark = pref === 'dark' || (pref === 'system' &&
    typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var uiSize = 'medium';
  try { uiSize = localStorage.getItem('schooltable.uiSize') || 'medium'; } catch (e2) { }
  if (['small', 'medium', 'large'].indexOf(uiSize) === -1) uiSize = 'medium';
  document.documentElement.setAttribute('data-ui-size', uiSize);
})();
</script>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"></rect><path d="M3.5 9h17M8 3v4M16 3v4"></path><path d="M7.5 13h3M13.5 13h3M7.5 16.5h3M13.5 16.5h3"></path></svg>
      </span>
      <div class="sidebar__brand-text">
        <div class="sidebar__brand-name">SchoolTable</div>
        <div class="sidebar__brand-sub">ระบบจัดตารางสอนอัตโนมัติ</div>
      </div>
    </div>
    <nav class="sidebar__nav" id="sidebarNav" aria-label="เมนูหลัก"></nav>
  </aside>

  <div class="main">
    <header class="topbar no-print">
      <button type="button" class="btn btn--sm topbar__menu" id="btnMenu" aria-label="ยุบเมนู" aria-controls="sidebar" aria-expanded="true">☰ เมนู</button>
      <div>
        <div class="topbar__school" id="topSchool">โรงเรียน</div>
        <div class="topbar__meta" id="topTerm">ปีการศึกษา — ภาคเรียน —</div>
      </div>
      <span id="topStatus"></span>
      <div class="topbar__spacer"></div>
      <div class="topbar__actions">
        <div class="ui-scale-control" role="group" aria-label="ปรับขนาดหน้าการทำงาน">
          <span class="ui-scale-control__label"><span class="ui-scale-control__mark" aria-hidden="true">Aa</span><span>ขนาด</span></span>
          <button type="button" class="ui-scale-btn" data-ui-size="small" aria-pressed="false" title="แสดงผลขนาดเล็ก">เล็ก</button>
          <button type="button" class="ui-scale-btn" data-ui-size="medium" aria-pressed="true" title="แสดงผลขนาดกลาง">กลาง</button>
          <button type="button" class="ui-scale-btn" data-ui-size="large" aria-pressed="false" title="แสดงผลขนาดใหญ่">ใหญ่</button>
        </div>
        <button type="button" class="btn btn--sm theme-toggle" id="btnTheme" aria-label="สลับธีม">
          <span class="theme-toggle__icon" id="themeIcon" aria-hidden="true">🌓</span>
        </button>
        <button type="button" class="btn btn--sm" id="btnTopPrint">🖨 พิมพ์ตาราง</button>
        <button type="button" class="btn btn--sm" id="btnTopBackup">💾 สำรองข้อมูล</button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div id="toastHost" aria-live="polite"></div>
<div id="printRoot"></div>

<script src="js/util.js"></script>
<script src="js/store.js?v=0.5.1"></script>
<script src="js/model.js?v=0.5.2"></script>
<script src="js/mockdata.js?v=0.5.1"></script>
<script src="js/scheduler.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/printing.js"></script>
<script src="js/components.js?v=0.4.8"></script>
<script src="js/ux.js?v=0.3.3"></script>
<script src="js/help.js?v=0.5.1"></script>
<script src="js/pages/overview.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/rooms.js"></script>
<script src="js/pages/subjects.js?v=0.5.1"></script>
<script src="js/pages/teachers.js?v=0.4.8"></script>
<script src="js/pages/curriculum.js?v=0.5.1"></script>
<script src="js/pages/sections.js?v=0.5.14"></script>
<script src="js/pages/assignments.js?v=0.4.9"></script>
<script src="js/pages/conditions.js?v=0.3.7"></script>
  <script src="js/pages/locks.js?v=0.1.9"></script>
<script src="js/pages/generate.js?v=0.5.1"></script>
<script src="js/pages/timetable.js?v=0.5.12"></script>
<script src="js/pages/issues.js?v=0.3.4"></script>
<script src="js/pages/print.js"></script>
<script src="js/pages/history.js"></script>
<script src="js/pages/import.js?v=0.5.5"></script>
<script src="js/app.js?v=0.5.2"></script>
</body>
</html>
